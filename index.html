<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automated Timetable Generator</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.14), transparent 28%),
                  linear-gradient(180deg, #020617 0%, #111827 100%);
      color: #e2e8f0;
      background-attachment: fixed;
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.7); border-radius: 9999px; }
    .dark .sidebar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.8); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
      border: 1px solid transparent;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #ffffff;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .input {
      width: 100%;
      min-height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.82);
      padding: 0.85rem 1rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input:focus {
      border-color: rgba(59, 130, 246, 0.65);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }
    .card {
      border-radius: 32px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 35px 80px rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(18px);
    }
    .section-title {
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
  </style>
</head>
<body style="margin:0; padding:0;">
  <div id="root" style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="color:#e2e8f0;font-family:system-ui,sans-serif;">Loading Timetable Generator...</div>
  </div>

  <!-- ESM Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.20.0",
        "recharts": "https://esm.sh/recharts@2.10.3",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.17.19",
        "zustand": "https://esm.sh/zustand@4.4.7",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
      }
    }
  </script>

  <script type="module" src="/app.js"></script>
</body>
</html>
